[package]
name = "class-ledger-app"
version = "1.0.0"
description = "Class Ledger & Student Management App"
authors = ["Class Ledger Team"]
edition = "2021"

[lib]
name = "ec_treasury_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
