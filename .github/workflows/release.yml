name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (Generate native Android)
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://fqmfelauoufzdpvlvhqx.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_nBGDAWeGZP4YpSD-ewlulg_aeOlKXPu' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign & Prepare Android Artifacts
        id: sign-apk
        run: |
          mkdir -p android-artifacts
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"

          # Locate Android build tools (apksigner & zipalign)
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(which apksigner || true)
          fi
          if [ ! -x "$ZIPALIGN" ]; then
            ZIPALIGN=$(which zipalign || true)
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "Using zipalign: $ZIPALIGN"

          # Determine Keystore to use
          KEYSTORE_FILE="release.keystore"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore from repository secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "No production keystore secret found. Generating self-signed release keystore for direct installation..."
            KS_PASS="classledger123"
            KEY_ALIAS="classledger"
            KEY_PASS="classledger123"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=ClassLedger, OU=ClassLedger, O=ClassLedger, C=US"
          fi

          sign_and_align_apk() {
            local src="$1"
            local dest="$2"
            echo "Signing APK: $src -> $dest"
            local aligned_tmp="aligned_tmp.apk"

            # 1. zipalign BEFORE apksigner (mandatory for v2/v3 signing schemes)
            if [ -x "$ZIPALIGN" ]; then
              "$ZIPALIGN" -f -v 4 "$src" "$aligned_tmp"
            else
              cp "$src" "$aligned_tmp"
            fi

            # 2. apksigner applies v1, v2, and v3 signature schemes (required for Android 11+)
            if [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks "$KEYSTORE_FILE" \
                --ks-pass "pass:$KS_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASS" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --v4-signing-enabled false \
                --out "$dest" \
                "$aligned_tmp"

              # 3. Verify signature
              "$APKSIGNER" verify --verbose "$dest"
            else
              # Fallback to jarsigner if apksigner is unavailable
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$KS_PASS" \
                -keypass "$KEY_PASS" \
                "$aligned_tmp" "$KEY_ALIAS"
              cp "$aligned_tmp" "$dest"
            fi
            rm -f "$aligned_tmp"
          }

          # Process Split and Universal APKs
          for apk in $(find android/app/build/outputs/apk/release -name "*.apk"); do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              sign_and_align_apk "$apk" "android-artifacts/ClassLedger-${VERSION}-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              sign_and_align_apk "$apk" "android-artifacts/ClassLedger-${VERSION}-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              sign_and_align_apk "$apk" "android-artifacts/ClassLedger-${VERSION}-x86_64.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              sign_and_align_apk "$apk" "android-artifacts/ClassLedger-${VERSION}-universal.apk"
            fi
          done

          # Default APK alias (use arm64-v8a as primary lightweight APK for standard download links)
          if [ -f "android-artifacts/ClassLedger-${VERSION}-arm64-v8a.apk" ]; then
            cp "android-artifacts/ClassLedger-${VERSION}-arm64-v8a.apk" "android-artifacts/ClassLedger-${VERSION}.apk"
          elif [ -f "android-artifacts/ClassLedger-${VERSION}-universal.apk" ]; then
            cp "android-artifacts/ClassLedger-${VERSION}-universal.apk" "android-artifacts/ClassLedger-${VERSION}.apk"
          fi

          # Process AAB (if generated)
          if [ -d "android/app/build/outputs/bundle/release" ]; then
            for aab in $(find android/app/build/outputs/bundle/release -name "*.aab"); do
              dest="android-artifacts/ClassLedger-${VERSION}.aab"
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$KS_PASS" \
                -keypass "$KEY_PASS" \
                "$aab" "$KEY_ALIAS" || true
              cp "$aab" "$dest"
            done
          fi

          # Remove any .idsig files so they are not uploaded
          rm -f android-artifacts/*.idsig

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-artifacts/*

  build-desktop:
    name: Build Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Export Web Bundle
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://fqmfelauoufzdpvlvhqx.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_nBGDAWeGZP4YpSD-ewlulg_aeOlKXPu' }}
        run: npm run export:web

      - name: Build Tauri Desktop Binaries
        run: npx tauri build

      - name: Collect Desktop Binaries
        id: collect-desktop
        run: |
          mkdir -p desktop-artifacts
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} desktop-artifacts/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} desktop-artifacts/ \; 2>/dev/null || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: desktop-artifacts/*

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Desktop Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: release-assets

      - name: Remove unwanted .idsig files
        run: rm -f release-assets/*.idsig

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
