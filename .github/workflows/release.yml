name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (Generate native Android)
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (if Keystore Secret provided)
        id: sign-apk
        run: |
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          OUTPUT_APK="ClassLedger-${VERSION}.apk"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing APK with repository keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$UNSIGNED_APK" "${{ secrets.ANDROID_KEY_ALIAS }}"
            zipalign -v 4 "$UNSIGNED_APK" "$OUTPUT_APK" || cp "$UNSIGNED_APK" "$OUTPUT_APK"
          else
            echo "Signing with debug key for direct installation..."
            cp "$UNSIGNED_APK" "$OUTPUT_APK"
          fi
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.sign-apk.outputs.apk_path }}

  build-desktop:
    name: Build Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Export Web Bundle
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
        run: npm run export:web

      - name: Build Tauri Desktop Binaries
        run: npx tauri build

      - name: Collect Desktop Binaries
        id: collect-desktop
        run: |
          mkdir -p desktop-artifacts
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} desktop-artifacts/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} desktop-artifacts/ \; 2>/dev/null || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: desktop-artifacts/*

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
